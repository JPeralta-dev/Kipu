<div class="landing">
  <!-- Global Background Art -->
  <ft-landing-background />

  <!-- All sections — constrained with overflow hidden for parallax safety -->
  <div class="landing__content">
    <!-- Scroll Progress Indicator -->
    <div class="scroll-progress" [style.transform]="'scaleX(' + scrollProgress() / 100 + ')'"></div>

    <!-- Public Navbar -->
    <ft-public-navbar />

    <!-- Hero Section -->
    <ft-hero-section />

    <!-- Shared Finance & Group Expenses (Staggered Cascading Cards) -->
    <ft-shared-finance />

    <!-- Product Showcase (Budgets, Goals, Insights, 3-Way Logging) -->
    <ft-product-showcase />

    <!-- Registration Methods & Telegram Flagship Section -->
    <section id="telegram" class="telegram-wrapper">
      <div class="telegram-wrapper__inner">
        <ft-telegram-section />
      </div>
    </section>

    <!-- Comparison Table -->
    @if (pricingEnabled) {
      <section class="comparison-wrapper" id="compare-plans">
        <ft-comparison-table [rows]="comparisonRows" />
      </section>
    }

    <!-- FAQ -->
    <section class="faq-wrapper">
      <ft-faq [items]="faqItems" />
    </section>

    <!-- Trust Signals -->
    <section class="trust-wrapper">
      <ft-trust-signals [badges]="trustBadges" />
    </section>

    <!-- Resources teaser -->
    <ft-resources-section />

    <!-- Final CTA -->
    <section class="final-cta-wrapper">
      <ft-final-cta />
    </section>

    <!-- Back to top -->
    <button
      class="back-to-top"
      [class.back-to-top--visible]="scrollProgress() > 5"
      (click)="scrollToTop()"
      aria-label="Back to top"
    >
      <ng-icon name="chevronRight" size="1.2rem" />
    </button>
  </div>

  <!-- Footer — outside constrained content so it breaks out to full viewport width -->
  <ft-footer />
</div>
