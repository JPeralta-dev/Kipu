<div class="landing">
  <!-- Global Background Art -->
  <ft-landing-background />

  <!-- All sections — constrained with overflow hidden for parallax safety -->
  <div class="landing__content">
    <!-- Scroll Progress Indicator -->
    <div class="scroll-progress" [style.transform]="'scaleX(' + scrollProgress() / 100 + ')'"></div>

    <!-- Public Navbar -->
    <ft-public-navbar />

    <!-- Hero Section -->
    <ft-hero-section />

    <!-- Quipu Braiding Scroll Experience (Authentic Andean Differentiator) -->
    <ft-quipu-braid />

    <!-- Features Section -->
    <section id="features" class="features">
      <div class="features__inner">
        <div class="features__header" ftSubtleReveal="per-word-crossfade" [delay]="200">
          <h2 class="features__title">{{ 'landing.features.title' | translate }}</h2>
          <button class="features__toggle" (click)="showAllFeatures.set(!showAllFeatures())">
            {{ showAllFeatures() ? ('landing.features.show_less' | translate) : ('landing.features.view_all' | translate) }}
            <ng-icon name="chevronRight" size="0.875rem" class="features__toggle-icon" [class.features__toggle-icon--open]="showAllFeatures()" />
          </button>
        </div>
        <div class="features__grid" [class.features__grid--expanded]="showAllFeatures()">
          @for (feature of features; track feature.title; let i = $index) {
            <ft-feature-card
              [icon]="feature.icon"
              [title]="feature.title | translate"
              [description]="feature.description | translate"
              ftSubtleReveal="fade-up"
              [delay]="300 + (i * 100)"
              [class.features__hidden]="i >= 4 && !showAllFeatures()"
            />
          }
        </div>
      </div>
    </section>

    <!-- Telegram Section -->
    <section id="telegram" class="telegram-wrapper">
      <div class="telegram-wrapper__inner">
        <div class="telegram-wrapper__header" ftSubtleReveal="per-word-crossfade" [delay]="200">
          <h2 class="telegram-wrapper__title">{{ 'landing.telegram.title' | translate }}</h2>
        </div>
        <ft-telegram-section ftSubtleReveal="micro-scale-fade" [delay]="400" />
      </div>
    </section>

    <!-- Comparison Table -->
    @if (pricingEnabled) {
      <section class="comparison-wrapper" id="compare-plans">
        <ft-comparison-table [rows]="comparisonRows" />
      </section>
    }

    <!-- Testimonials -->
    <section class="testimonials-wrapper">
      <ft-testimonials [items]="testimonials" />
    </section>

    <!-- FAQ -->
    <section class="faq-wrapper">
      <ft-faq [items]="faqItems" />
    </section>

    <!-- Trust Signals -->
    <section class="trust-wrapper">
      <ft-trust-signals [badges]="trustBadges" />
    </section>

    <!-- Resources teaser -->
    <ft-resources-section />

    <!-- Final CTA -->
    <section class="final-cta-wrapper">
      <ft-final-cta />
    </section>

    <!-- Back to top -->
    <button
      class="back-to-top"
      [class.back-to-top--visible]="scrollProgress() > 5"
      (click)="scrollToTop()"
      aria-label="Back to top"
    >
      <ng-icon name="chevronRight" size="1.2rem" />
    </button>
  </div>

  <!-- Footer — outside constrained content so it breaks out to full viewport width -->
  <ft-footer />
</div>
