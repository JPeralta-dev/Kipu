<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kipu — Personal Finance Tracker</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Your money, perfectly organized. Track expenses, understand spending patterns, and take control of your finances — free, no credit card required.">

  <!-- Open Graph (overridden at runtime by landing.component.ts) -->
  <meta property="og:title" content="Kipu — Your money, perfectly organized">
  <meta property="og:description" content="Track expenses, understand spending patterns, and take control of your finances. Free forever.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kipufinance.online">
  <meta property="og:image" content="https://kipufinance.online/assets/og/og-image.png">
  <meta property="og:image:secure_url" content="https://kipufinance.online/assets/og/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Kipu personal finance tracker">

  <!-- Twitter Card (overridden at runtime by landing.component.ts) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Kipu — Your money, perfectly organized">
  <meta name="twitter:description" content="Track expenses, understand spending patterns, and take control of your finances. Free forever.">
  <meta name="twitter:image" content="https://kipufinance.online/assets/og/og-image.png">
  <meta name="twitter:image:alt" content="Kipu personal finance tracker">

  <link rel="icon" type="image/png" href="/assets/kipu-mark.png">
  <script>
    (function() {
      try {
        // Theme detection
        var theme = localStorage.getItem('flowr_theme');
        if (theme === 'light') {
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.add('dark');
        }

        var favicon = document.querySelector('link[rel="icon"]');
        if (favicon) {
          favicon.href = theme === 'light' ? '/assets/kipu-mark-light.png' : '/assets/kipu-mark.png';
        }

        // Language detection (before Angular boots)
        var detectedLang = 'es';
        var storedLang = localStorage.getItem('flowr_language');
        if (storedLang && (storedLang === 'es' || storedLang === 'en' || storedLang === 'fr')) {
          detectedLang = storedLang;
        } else {
          var navLangs = navigator.languages || [navigator.language || ''];
          for (var i = 0; i < navLangs.length; i++) {
            var code = (navLangs[i] || '').slice(0, 2).toLowerCase();
            if (code === 'es' || code === 'en' || code === 'fr') {
              detectedLang = code;
              break;
            }
          }
        }
        document.documentElement.lang = detectedLang;
      } catch(e) {
        document.documentElement.classList.add('dark');
        document.documentElement.lang = 'en';
      }
    })();
  </script>

  <!-- Preconnect to backend for faster TLS handshake -->
  <link rel="preconnect" href="https://finance-tracker-backend-production-2573.up.railway.app">
</head>
<body>
  <app-root></app-root>
</body>
</html>
