<div class="app-container">
  <!-- Ambient background -->
  <div class="app-background"></div>

  <!-- Top navigation bar - only show on authenticated private routes -->
  @if (showTopbar()) {
    <ft-topbar />
  }

  <!-- Main content area -->
  <main class="app-main" [class.app-main--landing]="isLandingRoute()">
    <router-outlet />
  </main>

  <!-- Global overlays -->
  @defer (on idle) {
    <ft-command-palette />
  }
  <ft-toast-container />
  @defer (on idle) {
    <ft-category-modal />
  }
  @defer (on idle) {
    <ft-upgrade-modal />
  }
  <ft-consent-banner />
  @defer (on idle) {
    <ft-tour-overlay />
  }
  @if (showTopbar()) {
    @defer (on idle) {
      <ft-onboarding-checklist />
    }
  }
</div>
