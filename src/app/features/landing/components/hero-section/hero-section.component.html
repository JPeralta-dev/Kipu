<section class="hero">
  <div class="hero__inner">
    <!-- Left: Content -->
    <div class="hero__content">
      <div class="hero__badge">
        <span class="hero__badge-dot"></span>
        {{ 'landing.heroBadge' | translate }}
      </div>
      <h1 class="hero__title" [innerHTML]="'landing.heroTitle' | translate">
      </h1>
      <p class="hero__subtitle">
        {{ 'landing.heroSubtitle' | translate }}
      </p>
      <div class="hero__actions">
        <a routerLink="/register" class="hero__btn hero__btn--primary">
          {{ 'landing.cta.button' | translate }}
          <ng-icon name="chevronRight" size="1rem" />
        </a>
      </div>
      <div class="hero__trust">
        <span class="hero__trust-item">
          <ng-icon name="check" size="0.875rem" />
          {{ 'landing.trustFree' | translate }}
        </span>
        <span class="hero__trust-item">
          <ng-icon name="lockClosed" size="0.875rem" />
          {{ 'landing.trustNoCard' | translate }}
        </span>
        <span class="hero__trust-item">
          <ng-icon name="shieldCheck" size="0.875rem" />
          {{ 'landing.trustEncrypted' | translate }}
        </span>
      </div>
    </div>

    <!-- Right: Visual -->
    <div class="hero__visual">
      <ft-hero-visual />
    </div>
  </div>
</section>
